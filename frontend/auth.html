<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — PDFForge</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><polygon points='12 2 2 7 12 12 22 7 12 2'/></svg>">
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <span>PDFForge</span>
      </a>

      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">← Back to Hub</a>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="auth-container">
      <div class="auth-card">
        
        <!-- Auth Mode Tabs -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
          <button type="button" class="auth-tab" id="tab-register">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="form-login">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="name@company.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Sign In to PDFForge
          </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" style="display: none;">
          <div class="form-group">
            <label class="form-label" for="register-email">Email Address</label>
            <input type="email" id="register-email" class="form-input" placeholder="name@company.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="register-password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Create Free Account
          </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
          <p style="font-size: 0.8rem; color: var(--text-muted);">
            Protected by BCrypt & JWT token sessions.
          </p>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 PDFForge. Modular Full-Stack PDF Suite.</p>
  </footer>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
